# No explicit top-level `name:` / `container_name` is set: Compose derives the
# project name from the folder name, so cloning this repo into more than one
# directory (or renaming the folder) does not cause container/volume/network
# name collisions between the copies.
#
# ---------------------------------------------------------------------------
# Recommended deployment: `docker compose up -d --build` starts the database
# and the containerised app. This is what setup-and-start.ps1 runs by
# default. Requires only Docker - no local Node.js/npm install needed.
#
# Users reach the app over plain HTTP on port ${PORT} (default 5000). The
# app service is published directly to the host/LAN and binds 0.0.0.0, so
# any device on the same network can open http://<this-machine-ip>:${PORT}.
# This is the simplest, most reliable setup for internal/LAN access (no TLS
# certificate to install on each client).
#
# Optional HTTPS: an extra `caddy` reverse-proxy service (behind the
# "https" Compose profile) can terminate TLS on port 443 using an internal
# CA. It is NOT started by default - enable it with:
#     docker compose --profile https up -d --build
#   or setup-and-start.ps1 -Https
# See README.md "HTTPS / internal CA".
#
# For local development with hot-reload, use setup-and-start.ps1 -Dev instead:
# it starts only `db` here and runs the app on the host with `npm run dev`.
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-project_wrapped}
    ports:
      # Bound to loopback only: reachable from this machine (e.g. local psql,
      # or the host-run app in -Dev mode) but never exposed to the LAN or
      # internet. The containerised `app` service reaches the database over
      # the internal Compose network and does not need this published port.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - project_wrapped_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-project_wrapped}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-5000}
      # Optional Azure DevOps connection defaults (all non-secret except the
      # PAT, which is never sent to the browser - see server/routes.ts).
      AZURE_DEVOPS_BASE_URL: ${AZURE_DEVOPS_BASE_URL:-}
      AZURE_DEVOPS_ORGANIZATION: ${AZURE_DEVOPS_ORGANIZATION:-}
      AZURE_DEVOPS_PROJECT: ${AZURE_DEVOPS_PROJECT:-}
      AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT:-}
      # Cloudflare Access authentication (see AUTHENTICATION.md). Defaults to
      # disabled (the pre-existing no-auth LAN behavior). DEV_AUTH_EMAIL is
      # deliberately NOT passed through: dev-bypass is a local-development
      # mode and refuses to run in production anyway.
      AUTH_MODE: ${AUTH_MODE:-disabled}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      # Internal service-to-service connection (Compose DNS name "db"),
      # independent of the DATABASE_URL a host-run dev server would use.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-project_wrapped}
    # Published directly to the host and the LAN over plain HTTP. Docker
    # binds 0.0.0.0 by default, so other devices on the network can reach
    # http://<this-machine-ip>:${PORT}. The container listens on ${PORT}
    # internally (see the PORT env var above and Dockerfile EXPOSE).
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    depends_on:
      db:
        condition: service_healthy

  # Optional HTTPS reverse proxy. Only started when the "https" Compose
  # profile is active (docker compose --profile https up, or
  # setup-and-start.ps1 -Https). Not part of the default HTTP deployment.
  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    restart: unless-stopped
    environment:
      # Only used for informational/logging purposes inside the Caddyfile;
      # the site block itself is a catch-all (see Caddyfile) so it works
      # regardless of this value, including when the LAN/VPN-assigned
      # address of the host changes between reboots or VPN reconnects.
      ADVERTISED_HOST: ${ADVERTISED_HOST:-localhost}
    ports:
      # The only port this deployment publishes to the host/LAN.
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - project_wrapped_caddy_data:/data
      - project_wrapped_caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  project_wrapped_pgdata:
    name: project_wrapped_pgdata
  project_wrapped_caddy_data:
    name: project_wrapped_caddy_data
  project_wrapped_caddy_config:
    name: project_wrapped_caddy_config
